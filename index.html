<title>PulseLab Monitor</title>
<style>
:root{color-scheme:dark;--bg:#0a0f0d;--panel:#111a16;--panel2:#16221c;--line:#27382f;--fg:#e8f0ea;--mut:#92a89b;--acc:#5fe3a1;--accfg:#04130b;--red:#ff4651;--amb:#ffd23d;--cy:#3fd8ff;
--ecg:#4dff9a;--spo2:#3fd8ff;--nibp:#f1f4f2;--co2:#ffe14d;--temp:#c9d3ce}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
/* ---------- exibição (monitor) ---------- */
body.display{background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
body.display.hidecursor{cursor:none}
.stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:inline-size;background:#000;color:#fff;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.stage .top{position:absolute;inset:0 0 auto 0;height:4.4cqw;display:flex;align-items:center;gap:1.2cqw;padding:0 1cqw;border-bottom:.12cqw solid #1b2a22}
.stage .top{background:#050907}
.bed{display:flex;flex-direction:column;line-height:1.05;min-width:15cqw}.bed b{font-size:1.5cqw;letter-spacing:.05em}.bed span{font-size:1.05cqw;color:#9fb3a8;letter-spacing:.08em}
.banner{flex:1;height:3cqw;display:flex;align-items:center;justify-content:center;font-size:1.75cqw;font-weight:800;letter-spacing:.06em;border-radius:.3cqw;color:#7d9186;background:transparent;white-space:nowrap;overflow:hidden}
.banner.a3{background:#d3202a;color:#fff;animation:bR .9s steps(1) infinite}.banner.a2{background:var(--amb);color:#000;animation:bY 1.6s steps(1) infinite}.banner.a1{background:#2ec7e6;color:#00212a}
@keyframes bR{50%{background:#7a0f16}}@keyframes bY{50%{background:#7a6100;color:#fff}}
.tr{display:flex;align-items:center;gap:1cqw;font-size:1.5cqw;color:#cfe0d6;font-variant-numeric:tabular-nums}
.chip{font-size:1cqw;font-weight:700;padding:.2cqw .6cqw;border-radius:.3cqw;background:#40320a;color:var(--amb);letter-spacing:.05em}.mute{font-size:1cqw;font-weight:700;color:var(--amb)}
.main{position:absolute;inset:4.4cqw 0 2.8cqw 0;display:grid;grid-template-columns:70fr 30fr;grid-template-rows:minmax(0,1fr)}
.waves{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:.12cqw solid #1b2a22}
.wave{position:relative;min-height:0;flex:1;border-bottom:.1cqw solid #14211a}
.wave canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wl{position:absolute;left:.8cqw;top:.35cqw;font-size:1.05cqw;letter-spacing:.06em;opacity:.95;pointer-events:none;text-shadow:0 0 .4cqw #000}.wl b{font-size:1.2cqw}
.rt{position:absolute;right:.8cqw;top:.35cqw;font-size:1.1cqw;font-weight:700;letter-spacing:.06em;color:#b6c9be;pointer-events:none}
.frozen{position:absolute;left:35cqw;top:23cqw;transform:translate(-50%,-50%);font-size:2.6cqw;font-weight:800;letter-spacing:.2em;color:var(--amb);background:#000a;padding:.4cqw 1.4cqw;border:.15cqw solid var(--amb);border-radius:.4cqw;pointer-events:none}
.nums{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,13fr) minmax(0,11fr) minmax(0,10.5fr) minmax(0,9.5fr) minmax(0,5fr);min-width:0;min-height:0}
.box{grid-column:span 2;position:relative;padding:.5cqw 1cqw;border-bottom:.1cqw solid #14211a;color:var(--c);min-height:0;overflow:hidden}
.box .lab{font-size:1.2cqw;color:#b7c8be;letter-spacing:.05em;display:flex;gap:.6cqw;align-items:baseline;white-space:nowrap}.box .lab b{color:var(--c);font-size:1.45cqw}
.lim{margin-left:auto;font-size:1cqw;color:#8da298}
.val{font-size:9cqw;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:.1cqw;white-space:nowrap}

function startDisplay() {
  document.body.classList.add('display'); if (EMBED) document.body.classList.add('embed');

  $('root').innerHTML = MON;
  let S = loadS(), lastCtl = 0, seenCtl = false;
  const core = new Core(), now = () => Date.now();
  core.setState(S, clockT(S.clock, now()));
  const stage = $('stage'), CHD = [
    { k: 'ecg', buf: 'ecg', sp: 'speed' }, { k: 'pleth', buf: 'pl', sp: 'speed' }, { k: 'resp', buf: 'rs', sp: 'speed2' }, { k: 'capno', buf: 'co', sp: 'speed2' }
  ].map(o => { const w = $('w-' + o.k); return Object.assign(o, { w, g: w.querySelector('.g'), t: w.querySelector('.t'), W: 0, H: 0, lastN: null, dirty: true }); });
  const COL = { green: '#4dff9a', amber: '#ffc34d', white: '#f1f4f2' };
  const colorOf = c => c.k === 'ecg' ? COL[S.display.ecgcolor] || COL.green : c.k === 'pleth' ? '#3fd8ff' : '#ffe14d';
  const yOf = (c, s) => {
    const H = c.H, D = S.display;

    if (c.k === 'pleth') return H * 0.88 - s * H * 0.58;

  };
  function sizeAll() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    for (const c of CHD) {
      const r = c.w.getBoundingClientRect(), W = Math.round(r.width * dpr), H = Math.round(r.height * dpr);
      if (!W || !H) { c.W = 0; continue; }
      if (c.W !== W || c.H !== H || c.dpr !== dpr) { c.W = W; c.H = H; c.dpr = dpr; c.g.width = c.t.width = W; c.g.height = c.t.height = H; c.dirty = true; }
    }
  }
  function grid(c) {
    const x = c.g.getContext('2d'), W = c.W, H = c.H, pxmm = W / 150, D = S.display;
    x.clearRect(0, 0, W, H); x.lineWidth = Math.max(1, c.dpr * 0.6);
    if (c.k === 'ecg') {
      if (D.grid && pxmm >= 2.5) {
        for (let i = 0; i * pxmm < W; i++) { x.strokeStyle = i % 5 ? 'rgba(77,255,154,.09)' : 'rgba(77,255,154,.22)'; x.beginPath(); x.moveTo(i * pxmm, 0); x.lineTo(i * pxmm, H); x.stroke(); }
        for (let j = 0; j * pxmm < H; j++) { x.strokeStyle = j % 5 ? 'rgba(77,255,154,.09)' : 'rgba(77,255,154,.22)'; x.beginPath(); x.moveTo(0, j * pxmm); x.lineTo(W, j * pxmm); x.stroke(); }
      }
    } else {
      x.strokeStyle = 'rgba(255,255,255,.10)'; x.setLineDash([4 * c.dpr, 6 * c.dpr]);
      if (c.k === 'capno') {

function rmData(c, m) {

{ const sv = rmLoad(); if (sv.on && /^\d{6}$/.test(sv.pin || '')) { RM.pin = sv.pin; setTimeout(() => { if (!RM.on) rmStart(sv.pin); }, 700); } else rmRender(); }
