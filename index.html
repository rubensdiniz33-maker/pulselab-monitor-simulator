<title>PulseLab Monitor</title>
<style>
:root{color-scheme:dark;--bg:#0a0f0d;--panel:#111a16;--panel2:#16221c;--line:#27382f;--fg:#e8f0ea;--mut:#92a89b;--acc:#5fe3a1;--accfg:#04130b;--red:#ff4651;--amb:#ffd23d;--cy:#3fd8ff;
--ecg:#4dff9a;--spo2:#3fd8ff;--nibp:#f1f4f2;--co2:#ffe14d;--temp:#c9d3ce}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
/* ---------- exibição (monitor) ---------- */
body.display{background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
body.display.hidecursor{cursor:none}
.stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:inline-size;background:#000;color:#fff;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.stage .top{position:absolute;inset:0 0 auto 0;height:4.4cqw;display:flex;align-items:center;gap:1.2cqw;padding:0 1cqw;border-bottom:.12cqw solid #1b2a22}
.stage .top{background:#050907}
.bed{display:flex;flex-direction:column;line-height:1.05;min-width:15cqw}.bed b{font-size:1.5cqw;letter-spacing:.05em}.bed span{font-size:1.05cqw;color:#9fb3a8;letter-spacing:.08em}
.banner{flex:1;height:3cqw;display:flex;align-items:center;justify-content:center;font-size:1.75cqw;font-weight:800;letter-spacing:.06em;border-radius:.3cqw;color:#7d9186;background:transparent;white-space:nowrap;overflow:hidden}
.banner.a3{background:#d3202a;color:#fff;animation:bR .9s steps(1) infinite}.banner.a2{background:var(--amb);color:#000;animation:bY 1.6s steps(1) infinite}.banner.a1{background:#2ec7e6;color:#00212a}
@keyframes bR{50%{background:#7a0f16}}@keyframes bY{50%{background:#7a6100;color:#fff}}
.tr{display:flex;align-items:center;gap:1cqw;font-size:1.5cqw;color:#cfe0d6;font-variant-numeric:tabular-nums}
.chip{font-size:1cqw;font-weight:700;padding:.2cqw .6cqw;border-radius:.3cqw;background:#40320a;color:var(--amb);letter-spacing:.05em}.mute{font-size:1cqw;font-weight:700;color:var(--amb)}
.main{position:absolute;inset:4.4cqw 0 2.8cqw 0;display:grid;grid-template-columns:70fr 30fr;grid-template-rows:minmax(0,1fr)}
.waves{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:.12cqw solid #1b2a22}
.wave{position:relative;min-height:0;flex:1;border-bottom:.1cqw solid #14211a}
.wave canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wl{position:absolute;left:.8cqw;top:.35cqw;font-size:1.05cqw;letter-spacing:.06em;opacity:.95;pointer-events:none;text-shadow:0 0 .4cqw #000}.wl b{font-size:1.2cqw}
.rt{position:absolute;right:.8cqw;top:.35cqw;font-size:1.1cqw;font-weight:700;letter-spacing:.06em;color:#b6c9be;pointer-events:none}
.frozen{position:absolute;left:35cqw;top:23cqw;transform:translate(-50%,-50%);font-size:2.6cqw;font-weight:800;letter-spacing:.2em;color:var(--amb);background:#000a;padding:.4cqw 1.4cqw;border:.15cqw solid var(--amb);border-radius:.4cqw;pointer-events:none}
.nums{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,13fr) minmax(0,11fr) minmax(0,10.5fr) minmax(0,9.5fr) minmax(0,5fr);min-width:0;min-height:0}
.box{grid-column:span 2;position:relative;padding:.5cqw 1cqw;border-bottom:.1cqw solid #14211a;color:var(--c);min-height:0;overflow:hidden}
.box .lab{font-size:1.2cqw;color:#b7c8be;letter-spacing:.05em;display:flex;gap:.6cqw;align-items:baseline;white-space:nowrap}.box .lab b{color:var(--c);font-size:1.45cqw}
.lim{margin-left:auto;font-size:1cqw;color:#8da298}
.val{font-size:9cqw;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:.1cqw;white-space:nowrap}
.sub{position:absolute;right:1cqw;bottom:.6cqw;font-size:1.25cqw;color:#c4d3ca;text-align:right;line-height:1.25}.sub b{color:var(--c);font-weight:700}
#b-hr{--c:var(--ecg)}#b-spo2{--c:var(--spo2)}#b-nibp{--c:var(--nibp)}#b-etco2,#b-rr{--c:var(--co2)}#b-temp{--c:var(--temp)}
#b-spo2 .val{font-size:8cqw}#b-nibp .val{font-size:6cqw;margin-top:.5cqw}#b-nibp .val.dash{font-size:4.2cqw;margin-top:1.3cqw;letter-spacing:.1em}#b-nibp .sub{max-width:11cqw}

const rmSave = o => { try { localStorage.setItem(RMK, JSON.stringify(o)); } catch (e) {} };
const newPin = () => String(100000 + Math.floor(Math.random() * 900000));
const rmSend = (c, m) => { try { c.send(m); } catch (e) {} };
function rmBroadcast(m) { RM.conns.forEach(o => rmSend(o.c, m)); }

function alarmList() {
  const all = [...displays.values()], proj = all.filter(d => !d.embed);
  const al = [].concat(...proj.map(d => d.alarms)).concat(proj.length ? [] : (all[0] || { alarms: [] }).alarms), seen = new Set();
  return al.filter(a => !seen.has(a.text) && seen.add(a.text)).sort((a, b) => b.prio - a.prio);
}
function rmHb() { if (RM.conns.size) rmBroadcast({ t: 'rhb', P: curP(), run: S.clock.running, al: alarmList().slice(0, 3) }); }

function rmStop(keepOn) {
  clearTimeout(RM.retryT); const p = RM.peer; RM.peer = null;
  RM.conns.forEach(o => { try { o.c.close(); } catch (e) {} }); RM.conns.clear();
  try { p && p.destroy(); } catch (e) {}
  if (!keepOn) { RM.on = false; RM.status = 'off'; rmSave({ on: false, pin: RM.pin }); }
  rmRender();
}
function rmStart(pin) {
  if (RM.peer) rmStop(true);
  let P; try { P = PeerClass(); } catch (e) { RM.on = true; RM.status = 'err'; RM.err = 'Não foi possível carregar o módulo de conexão.'; rmRender(); return; }
  RM.on = true; RM.pin = pin || RM.pin || newPin(); RM.status = 'connecting'; RM.err = ''; rmSave({ on: true, pin: RM.pin }); rmRender();
  const p = new P(peerId(RM.pin), peerOpts()); RM.peer = p;
  const later = (fn, ms) => { clearTimeout(RM.retryT); RM.retryT = setTimeout(() => { if (RM.on && RM.peer === p) fn(); }, ms); };
  p.on('open', () => { if (RM.peer !== p) return; RM.status = 'on'; RM.err = ''; RM.tries = 0; rmRender(); });
  p.on('error', e => {
    if (RM.peer !== p) return; const t = e && e.type;
    if (t === 'unavailable-id') { RM.tries++; RM.status = 'connecting'; rmRender(); later(() => { if (RM.tries > 3) { RM.tries = 0; rmStart(newPin()); } else rmStart(RM.pin); }, 3000); }
    else if (t === 'peer-unavailable') return;
    else { RM.status = 'err'; RM.err = (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') ? 'Sem internet ou servidor de pareamento indisponível. Tentando de novo…' : 'Falha na conexão (' + (t || 'erro') + '). Tentando de novo…'; rmRender(); later(() => rmStart(RM.pin), 6000); }
  });
  p.on('disconnected', () => { if (RM.peer !== p || p.destroyed) return; RM.status = 'connecting'; rmRender(); try { p.reconnect(); } catch (e) {} });
  p.on('connection', c => {
    if (RM.peer !== p) return;
    if (RM.conns.size >= 6) { c.on('open', () => { try { c.close(); } catch (e) {} }); return; }
    c.on('open', () => { RM.conns.set(c.peer, { c, last: now(), n: 'Celular ' + (++RM.seq) }); rmSend(c, { t: 'state', s: S }); rmHb(); rmRender(); toast('Celular conectado'); logEv('Celular conectado'); });
    c.on('data', d => rmData(c, d));
    const gone = () => { if (RM.conns.get(c.peer) && RM.conns.get(c.peer).c === c) { RM.conns.delete(c.peer); rmRender(); logEv('Celular desconectado'); } };
    c.on('close', gone); c.on('error', gone);
  });
}
function rmData(c, m) {
  const o = RM.conns.get(c.peer); if (!o || !m || typeof m !== 'object') return; o.last = now();
  if (m.t === 'ping') { rmSend(c, { t: 'pong' }); return; }
  if (m.t === 'hello') { rmSend(c, { t: 'state', s: S }); rmHb(); return; }
  if (m.t !== 'cmd') return;
  if (readOnly) { rmSend(c, { t: 'ro' }); return; }
  try { rmCmd(m); } catch (e) {}
}
function rmCmd(m) {
  switch (m.c) {
    case 'scenario': if (SC[m.id]) applyScenario(m.id); break;
    case 'basal': applyScenario('basal'); break;
    case 'phase': goPhase(S.scen.phase + 1); break;
    case 'pause': commit(n => reanchor(n, false)); break;
    case 'resume': commit(n => reanchor(n, true)); break;
    case 'rate': if ([1, 2, 5, 10].includes(Number(m.v))) commit(n => reanchor(n, n.clock.running, Number(m.v))); break;
    case 'nibp': startNibp(); break;
    case 'silence': commit(n => { n.alarm.silencedUntil = n.alarm.silencedUntil > now() ? 0 : now() + 120000; }); break;
    case 'mute': commit(n => { n.audio.mute = !!m.v; }); break;
    case 'rhythm': if (RH[m.r]) { setRhythm(m.r); applyDraft(); } break;
    case 'params': {
      const d = m.d || {}; draft.ectopy = clamp(Math.round(Number(d.ectopy) || 0), 0, 30); draft.vf = d.vf === 'fine' ? 'fine' : 'coarse'; draft.dur = DURS.some(x => x[0] === Number(d.dur)) ? Number(d.dur) : 0;
      PAR.forEach(p => { const v = Number(d[p[0]]); if (Number.isFinite(v)) draft[p[0]] = Math.round(clamp(v, p[3], p[4]) * 10) / 10; });
      applyDraft(); break;
    }
    case 'shock': { const so = $('shock-out'); if (so && ['none', 'asys', 'pea', 'rce'].includes(m.out)) so.value = m.out; if (['vf', 'vtp', 'vt', 'tdp'].includes(S.rhythm)) shock(); break; }
    case 'cpr': if (PULSELESS.has(S.rhythm)) toggleCpr(); break;
    case 'rce': if (PULSELESS.has(S.rhythm)) rce(); break;
    case 'losepulse': if (S.rhythm === 'vt') { draft.rhythm = 'vt'; setRhythm('vtp'); applyDraft(); } break;
  }
}
setInterval(() => { rmHb(); const t = now(); RM.conns.forEach((o, k) => { if (t - o.last > 16000) { try { o.c.close(); } catch (e) {} RM.conns.delete(k); rmRender(); } }); }, 1000);

/* ---- janela «Celular» ---- */
const mod = document.createElement('div'); mod.className = 'modal hide'; mod.id = 'phmodal'; mod.setAttribute('role', 'dialog'); mod.setAttribute('aria-modal', 'true'); mod.setAttribute('aria-label', 'Controlar pelo celular'); document.body.appendChild(mod);
const phOpen = () => { mod.classList.remove('hide'); rmRender(); }, phClose = () => mod.classList.add('hide');
mod.addEventListener('click', e => { if (e.target === mod) phClose(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape' && !mod.classList.contains('hide')) phClose(); });
$('phone').onclick = phOpen;
function qrSvg(text) { loadLib('vend-qr'); const q = qrcode(0, 'M'); q.addData(text); q.make(); return q.createSvgTag({ cellSize: 4, margin: 0, scalable: true }); }
function rmRender() {
  const n = RM.conns.size, b = $('phone'); if (b) { b.innerHTML = ic('phone') + '<span class="lb">Celular' + (n ? ' · ' + n : '') + '</span>'; b.classList.toggle('pri', n > 0); }
  if (mod.classList.contains('hide')) return;
  const url = remoteUrl(RM.pin), local = /^(file:|about:)/.test(location.protocol), pinTxt = RM.pin ? RM.pin.slice(0, 3) + ' ' + RM.pin.slice(3) : '--- ---';
  let body;
  if (!RM.on) body = `<p style="margin:0;color:var(--mut)">Transforma o celular em controle remoto: o professor escolhe cenários, ajusta sinais vitais, congela, silencia e restaura o basal <b style="color:var(--fg)">sem encostar no computador</b>. O celular <b style="color:var(--fg)">não mostra o monitor</b>, apenas os controles.</p><button class="btn pri" id="ph-on" style="align-self:flex-start;padding:10px 18px">Ativar conexão com celular</button><div class="hint">Usa a internet apenas para o pareamento (servidor público do PeerJS); depois os aparelhos conversam direto. Nada é salvo em servidor.</div>`;
  else {
    let qr = ''; try { qr = qrSvg(url); } catch (e) { qr = '<div style="color:#000;padding:10px;font-size:12px">QR indisponível</div>'; }
    const st = RM.status === 'on' ? (n ? `<b style="color:var(--acc)">${n} celular${n > 1 ? 'es' : ''} conectado${n > 1 ? 's' : ''}</b>` : '<span style="color:var(--amb)">Aguardando celular…</span>') : RM.status === 'err' ? `<span style="color:#ff9aa0">${RM.err}</span>` : '<span style="color:var(--amb)">Conectando ao servidor de pareamento…</span>';
    body = `<div class="phgrid"><div class="qrbox" role="img" aria-label="QR Code para conectar o celular">${qr}</div><div><div class="hint">PIN</div><div class="pinbig" id="ph-pin">${pinTxt}</div><ol class="phsteps"><li>Aponte a <b>câmera do celular</b> para o QR Code, <b>ou</b></li><li>abra <span class="phurl">${remoteUrl('').split('?')[0]}?mode=remote</span> e digite o <b>PIN</b>.</li></ol></div></div>
<div id="ph-st">${st}</div>${local ? '<div class="hint" style="color:var(--amb)">Você abriu o arquivo direto do computador (file://). O QR só funciona quando o monitor está publicado em um endereço da internet (por exemplo, GitHub Pages).</div>' : ''}
<div class="phdev">${[...RM.conns.entries()].map(([k, o]) => `<div class="row"><span>📱 ${o.n}</span><button class="btn sm" data-kick="${k}">Desconectar</button></div>`).join('')}</div>
<div class="row"><button class="btn" id="ph-new">Gerar novo PIN</button><span class="sp"></span><button class="btn dan" id="ph-off">Desativar celular</button></div>
<div class="hint">Celular e computador precisam estar online. Em alguns Wi‑Fi de escolas (que isolam os aparelhos), use os dados móveis no celular.</div>`;
  }
  mod.innerHTML = `<div class="mbox"><div class="mh"><b style="display:inline-flex;gap:9px;align-items:center">${ic('phone')} Controlar pelo celular</b><button class="btn sm" id="ph-x" aria-label="Fechar">${ic('x')}</button></div><div class="mb">${body}</div></div>`;
  $('ph-x').onclick = phClose; const on = $('ph-on'); if (on) on.onclick = () => rmStart(rmLoad().pin);
  const nw = $('ph-new'); if (nw) nw.onclick = () => { rmStop(true); rmStart(newPin()); };
  const off = $('ph-off'); if (off) off.onclick = () => rmStop(false);
  mod.querySelectorAll('[data-kick]').forEach(k => k.onclick = () => { const o = RM.conns.get(k.dataset.kick); if (o) { try { o.c.close(); } catch (e) {} RM.conns.delete(k.dataset.kick); rmRender(); } });
}
$('mutebtn').onclick = () => commit(n => { n.audio.mute = !n.audio.mute; });
{ const sv = rmLoad(); if (sv.on && /^\d{6}$/.test(sv.pin || '')) { RM.pin = sv.pin; setTimeout(() => { if (!RM.on) rmStart(sv.pin); }, 700); } else rmRender(); }

  setInterval(() => { if (!readOnly) post({ t: 'chb', rev: S.rev }); }, 2000);
  /* ---- painel de estado ---- */
  function status() {
    const t = now(); for (const [k, v] of displays) if (t - v.t > 6000) displays.delete(k);
    const proj = [...displays.values()].filter(d => !d.embed), pd = $('p-disp'); pd.className = 'pill ' + (proj.length ? 'ok' : 'warn'); pd.lastChild.textContent = proj.length ? 'Projeção conectada' + (proj.length > 1 ? ' (' + proj.length + ')' : '') : 'Projeção desconectada';
    const tr = truth(S, curP()), m = (proj[0] || [...displays.values()][0] || {}).m || {};
    $('p-t').lastChild.textContent = 'Simulação ' + simT();
    const f = v => v === null || v === undefined ? '---' : v;
    $('kv').innerHTML = `<span>Ritmo</span><b>${RH[S.rhythm]}${S.cpr ? ' + RCP' : ''}</b><span>FC (alvo)</span><b>${Math.round(tr.hr)} bpm</b><span>PA (alvo)</span><b>${Math.round(tr.sys)}/${Math.round(tr.dia)} (PAM ${Math.round(tr.map)})</b><span>SpO₂ (alvo)</span><b>${Math.round(tr.spo2)} %</b><span>FR / EtCO₂ (alvo)</span><b>${Math.round(tr.rr)} / ${Math.round(tr.etco2)}</b><span>Temp</span><b>${temp1(tr.temp)} °C</b><span>Monitor mede</span><b>${f(m.hr)} · ${f(m.pr)} · ${f(m.spo2)} · ${f(m.rr)} · ${f(m.etco2)}</b>`;
    { const N = S.nibp, R = N.res, ms = proj.length ? m : null, T0 = curT(), measuring = N.state === 'meas' && T0 >= N.startT && T0 <= N.startT + NIBP_SECONDS + 4;
      const tg = (mv, tv) => ms ? { v: f(mv), t: false } : { v: tv, t: true };
      const tiles = [['hr', 'FC', 'bpm', 'pulse', '#4dff9a', tg(ms && ms.hr, Math.round(tr.hr)), 'pulso ' + f(ms && ms.pr)], ['spo2', 'SpO₂', '%', 'drop', '#3fd8ff', tg(ms && ms.spo2, Math.round(tr.spo2)), 'alvo ' + Math.round(tr.spo2)],
        ['nibp', 'PNI', 'mmHg', 'cuff', '#f1f4f2', { v: measuring ? 'medindo' : (R && R.ok ? R.sys + '/' + R.dia : '---'), t: false }, measuring ? '' : (R && R.ok ? 'PAM ' + R.map : 'sem leitura')],
        ['etco2', 'EtCO₂', 'mmHg', 'lungs', '#ffe14d', tg(ms && ms.etco2, Math.round(tr.etco2)), 'alvo ' + Math.round(tr.etco2)], ['rr', 'FR', 'irpm', 'wind', '#ffe14d', tg(ms && ms.rr, Math.round(tr.rr)), 'alvo ' + Math.round(tr.rr)], ['temp', 'TEMP', '°C', 'thermo', '#c9d3ce', { v: temp1(tr.temp), t: !ms }, 'alvo']];
      const kp = $('kpis'); if (!kp.children.length) kp.innerHTML = tiles.map(t => `<div class="kpi" style="--kc:${t[4]}"><div class="kl">${ic(t[3])}${t[1]}<small style="margin-left:auto;font-weight:600;letter-spacing:0;color:#7b9186">${t[2]}</small></div><div class="kv2" id="kp-${t[0]}"></div><div class="ks" id="ks-${t[0]}"></div></div>`).join('');
      tiles.forEach(t => { const e = $('kp-' + t[0]), v = String(t[5].v); if (e.textContent !== v) { e.textContent = v; e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); } e.classList.toggle('tg', t[5].t); e.classList.toggle('sm', v.length > 6); $('ks-' + t[0]).textContent = t[6]; });
      $('kp-src').textContent = ms ? 'valores medidos pelo monitor' : 'projeção fechada: mostrando os alvos';
      $('chips').innerHTML = `<span class="chipx">${ic('heart')}${RH[S.rhythm]}</span><span class="chipx">${ic('scenario')}${(SC[S.scen.id] || { name: 'Personalizado' }).name}</span>${S.cpr ? `<span class="chipx red">${ic('bolt')}RCP em curso</span>` : ''}${S.clock.running ? '' : `<span class="chipx red">${ic('pause')}Congelado</span>`}${S.alarm.silencedUntil > now() ? `<span class="chipx red">${ic('bellOff')}Alarmes silenciados</span>` : ''}${S.audio.mute ? `<span class="chipx red">${ic('mute')}Som desligado</span>` : ''}`; }
    const al = [].concat(...[...displays.values()].filter(d => !d.embed).map(d => d.alarms)).concat(proj.length ? [] : ([...displays.values()][0] || { alarms: [] }).alarms);
    const seen = new Set(), list = al.filter(a => !seen.has(a.text) && seen.add(a.text)).sort((a, b) => b.prio - a.prio);
    const cur = new Set(list.map(a => a.text)); for (const t of cur) if (!seenAl.has(t)) logEv('Alarme: ' + t); seenAl.clear(); cur.forEach(t => seenAl.add(t));
    $('log').innerHTML = LOG.length ? LOG.slice(0, 14).map(l => `<div><b style="color:var(--fg);font-variant-numeric:tabular-nums">${l[0]}</b> &nbsp;${l[1]}</div>`).join('') : 'Nenhum evento ainda.';
    $('alarms').innerHTML = list.length ? '<div class="alist">' + list.map(a => `<div class="al p${a.prio}">${a.text}</div>`).join('') + '</div>' : '<div class="hint">Sem alarmes ativos.</div>';
    if (S.scen.id !== 'custom') renderPhase();
    const ss = $('snd-st'); if (ss) { ss.textContent = proj.length ? (proj.some(d => d.audio === 'ok') ? 'Projeção conectada: som liberado.' : 'Projeção conectada: aguardando o clique inicial na tela da projeção.') : 'Projeção fechada. Abra a projeção e clique nela uma vez para liberar o som.'; ss.style.color = proj.some(d => d.audio === 'ok') ? 'var(--acc)' : 'var(--amb)'; }
  }
  setInterval(status, 500); status();
  window.addEventListener('storage', e => { if (e.key === LS && e.newValue && readOnly) { try { S = sanitize(JSON.parse(e.newValue)); draft = mkDraft(); renderAll(); } catch (err) {} } });
  window.__pl = { get S() { return S; }, get RM() { return RM; }, ids: SCENARIOS.map(x => x.id), commit, applyScenario };
}

if (MODE === 'display') startDisplay(); else if (MODE === 'remote') startRemote(); else startConsole();
})();
