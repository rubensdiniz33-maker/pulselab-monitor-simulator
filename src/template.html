<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000"><meta name="build" content="__BUILD__"><link rel="icon" type="image/svg+xml" href="__ICON_SVG__"><link rel="icon" type="image/png" sizes="32x32" href="__ICON_32__"><link rel="apple-touch-icon" href="__ICON_180__">
<title>PulseLab Monitor</title>
<style>
:root{color-scheme:dark;--bg:#0a0f0d;--panel:#111a16;--panel2:#16221c;--line:#27382f;--fg:#e8f0ea;--mut:#92a89b;--acc:#5fe3a1;--accfg:#04130b;--red:#ff4651;--amb:#ffd23d;--cy:#3fd8ff;
--ecg:#4dff9a;--spo2:#3fd8ff;--nibp:#f1f4f2;--co2:#ffe14d;--temp:#c9d3ce}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
/* ---------- exibição (monitor) ---------- */
body.display{background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center}
body.display.hidecursor{cursor:none}
.stage{position:relative;width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;container-type:inline-size;background:#000;color:#fff;overflow:hidden;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.stage .top{position:absolute;inset:0 0 auto 0;height:4.4cqw;display:flex;align-items:center;gap:1.2cqw;padding:0 1cqw;border-bottom:.12cqw solid #1b2a22}
.stage .top{background:#050907}
.bed{display:flex;flex-direction:column;line-height:1.05;min-width:15cqw}.bed b{font-size:1.5cqw;letter-spacing:.05em}.bed span{font-size:1.05cqw;color:#9fb3a8;letter-spacing:.08em}
.banner{flex:1;height:3cqw;display:flex;align-items:center;justify-content:center;font-size:1.75cqw;font-weight:800;letter-spacing:.06em;border-radius:.3cqw;color:#7d9186;background:transparent;white-space:nowrap;overflow:hidden}
.banner.a3{background:#d3202a;color:#fff;animation:bR .9s steps(1) infinite}.banner.a2{background:var(--amb);color:#000;animation:bY 1.6s steps(1) infinite}.banner.a1{background:#2ec7e6;color:#00212a}
@keyframes bR{50%{background:#7a0f16}}@keyframes bY{50%{background:#7a6100;color:#fff}}
.tr{display:flex;align-items:center;gap:1cqw;font-size:1.5cqw;color:#cfe0d6;font-variant-numeric:tabular-nums}
.chip{font-size:1cqw;font-weight:700;padding:.2cqw .6cqw;border-radius:.3cqw;background:#40320a;color:var(--amb);letter-spacing:.05em}.mute{font-size:1cqw;font-weight:700;color:var(--amb)}
.main{position:absolute;inset:4.4cqw 0 2.8cqw 0;display:grid;grid-template-columns:70fr 30fr;grid-template-rows:minmax(0,1fr)}
.waves{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:.12cqw solid #1b2a22}
.wave{position:relative;min-height:0;flex:1;border-bottom:.1cqw solid #14211a}
.wave canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.wl{position:absolute;left:.8cqw;top:.35cqw;font-size:1.05cqw;letter-spacing:.06em;opacity:.95;pointer-events:none;text-shadow:0 0 .4cqw #000}.wl b{font-size:1.2cqw}
.rt{position:absolute;right:.8cqw;top:.35cqw;font-size:1.1cqw;font-weight:700;letter-spacing:.06em;color:#b6c9be;pointer-events:none}
.frozen{position:absolute;left:35cqw;top:23cqw;transform:translate(-50%,-50%);font-size:2.6cqw;font-weight:800;letter-spacing:.2em;color:var(--amb);background:#000a;padding:.4cqw 1.4cqw;border:.15cqw solid var(--amb);border-radius:.4cqw;pointer-events:none}
.nums{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,13fr) minmax(0,11fr) minmax(0,10.5fr) minmax(0,9.5fr) minmax(0,5fr);min-width:0;min-height:0}
.box{grid-column:span 2;position:relative;padding:.5cqw 1cqw;border-bottom:.1cqw solid #14211a;color:var(--c);min-height:0;overflow:hidden}
.box .lab{font-size:1.2cqw;color:#b7c8be;letter-spacing:.05em;display:flex;gap:.6cqw;align-items:baseline;white-space:nowrap}.box .lab b{color:var(--c);font-size:1.45cqw}
.lim{margin-left:auto;font-size:1cqw;color:#8da298}
.val{font-size:9cqw;line-height:1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:.1cqw;white-space:nowrap}
.sub{position:absolute;right:1cqw;bottom:.6cqw;font-size:1.25cqw;color:#c4d3ca;text-align:right;line-height:1.25}.sub b{color:var(--c);font-weight:700}
#b-hr{--c:var(--ecg)}#b-spo2{--c:var(--spo2)}#b-nibp{--c:var(--nibp)}#b-etco2,#b-rr{--c:var(--co2)}#b-temp{--c:var(--temp)}
#b-spo2 .val{font-size:8cqw}#b-nibp .val{font-size:6cqw;margin-top:.5cqw}#b-nibp .val.dash{font-size:4.2cqw;margin-top:1.3cqw;letter-spacing:.1em}#b-nibp .sub{max-width:11cqw}
.box.half{grid-column:span 1;border-right:.1cqw solid #14211a}#b-etco2 .val,#b-rr .val{font-size:5.8cqw;margin-top:.3cqw}
.xbtn{display:none}body.embed .xbtn{display:flex;position:absolute;top:3px;right:3px;width:18px;height:18px;z-index:4;background:#000c;border:1px solid #ffffff66;color:#fff;border-radius:50%;align-items:center;justify-content:center;padding:0;font:14px/1 system-ui;cursor:pointer}body.embed .xbtn:hover{background:#c0392b;border-color:#fff}
body.embed .edit{cursor:grab}body.embed .edit.dragging{opacity:.35}body.embed .edit.over{outline:2px dashed var(--ecg);outline-offset:-2px}body.embed .rt{right:30px}body.embed .lim{margin-right:24px}
#b-temp{display:flex;align-items:center;gap:1cqw;padding-top:0;padding-bottom:0}#b-temp .val{font-size:3.2cqw;margin:0}#b-temp .lab{font-size:1.2cqw}
.dot{display:inline-block;width:.9cqw;height:.9cqw;border-radius:50%;background:var(--ecg);opacity:.15;margin-left:.3cqw;align-self:center}.dot.on{opacity:1;box-shadow:0 0 .8cqw var(--ecg)}
.box.al3{outline:.22cqw solid var(--red);outline-offset:-.22cqw;animation:fR .9s steps(1) infinite}.box.al2{outline:.22cqw solid var(--amb);outline-offset:-.22cqw;animation:fY 1.6s steps(1) infinite}.box.al1{outline:.18cqw solid var(--cy);outline-offset:-.18cqw}
@keyframes fR{50%{background:#4d0b10}}@keyframes fY{50%{background:#3d3000}}
@media(prefers-reduced-motion:reduce){.banner.a3,.banner.a2,.box.al3,.box.al2{animation:none}}
.foot{position:absolute;inset:auto 0 0 0;height:2.8cqw;display:flex;align-items:center;justify-content:space-between;gap:1cqw;padding:0 1cqw;font-size:.95cqw;color:#7f9387;letter-spacing:.05em;border-top:.1cqw solid #14211a;background:#050907;white-space:nowrap}
.foot .mid{color:#9bb0a4;font-weight:700}
.sndst{color:#9bb0a4;font-weight:700}.sndst.off{color:#c9902a}
.gate{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2cqw;background:rgba(0,0,0,.8);color:#fff;text-align:center;cursor:pointer;border:0;width:100%;font-family:inherit}
.gate b{font-size:3cqw;letter-spacing:.14em}.gate span{font-size:1.4cqw;color:#b6c9be;letter-spacing:.04em;max-width:60cqw;line-height:1.5}.gate i{font-style:normal;font-size:1.3cqw;font-weight:800;letter-spacing:.14em;padding:.7cqw 2cqw;border:.15cqw solid var(--ecg);color:var(--ecg);border-radius:.4cqw}
.tag{position:absolute;right:1cqw;top:4.9cqw;font-size:.9cqw;letter-spacing:.2em;color:#ffffff33;pointer-events:none;display:none}
body.embed .gate,body.embed .sndst{display:none}
/* ---------- console do professor ---------- */
body.console{overflow:auto;min-width:1000px}
.top2{position:sticky;top:0;z-index:5;height:50px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#0a110e;border-bottom:1px solid var(--line)}
.top2 .btn{white-space:nowrap}.top2 .brand{white-space:nowrap}
.brand{font-weight:900;letter-spacing:.18em;font-size:13px;margin-right:6px}.brand span{color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border:1px solid var(--line);border-radius:4px;font-size:12px;color:var(--mut);background:var(--panel);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:#5b6f64;display:inline-block}.pill.ok i{background:var(--acc);box-shadow:0 0 6px var(--acc)}.pill.warn i{background:var(--amb)}.pill.bad i{background:var(--red)}
.sp{flex:1}
.cwrap{display:grid;grid-template-columns:268px minmax(0,1fr) 440px;gap:10px;padding:10px 12px;height:calc(100vh - 50px);min-height:620px}
.cwrap>*{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:5px;flex:none}
.ph{padding:7px 12px;font-size:11px;letter-spacing:.12em;font-weight:800;color:var(--mut);border-bottom:1px solid var(--line);text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:center;min-height:32px}
.pb{padding:10px 12px}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:4px;padding:6px 11px;font-weight:600;font-size:13px}.btn:hover{border-color:#5d8f75}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:800}.btn.dan{border-color:#7a2a30;color:#ff9aa0}.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#0b130f;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:9px 13px;color:var(--mut);font-weight:700;white-space:nowrap;font-size:13px}.tab.on{color:var(--acc);border-bottom-color:var(--acc);background:var(--panel)}
.page{display:none}.page.on{display:block}
.sgrp{font-size:10.5px;letter-spacing:.14em;color:#6f867a;font-weight:800;padding:7px 12px 2px;text-transform:uppercase}
.scl{display:flex;flex-direction:column;padding-bottom:6px}
.sc{display:flex;align-items:baseline;gap:8px;text-align:left;padding:3px 12px;border:0;border-left:3px solid transparent;background:transparent;width:100%}.sc:hover{background:var(--panel2)}
.sc .n{font-size:11px;color:#6f867a;width:12px;flex:none;font-variant-numeric:tabular-nums}.sc b{font-size:13px;font-weight:600;line-height:1.3}.sc small{display:block;color:var(--mut);font-size:11px;font-weight:400;line-height:1.25}.sc.on{border-left-color:var(--acc);background:#0f2318}.sc.on b{color:var(--acc)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px}
.qc{border:1px solid var(--line);border-radius:4px;padding:6px 8px;background:#0c1511;min-width:0}
.qc .ql{display:flex;justify-content:space-between;font-size:11.5px;color:#c3d3c9;font-weight:700;letter-spacing:.04em}.qc .ql small{color:var(--mut);font-weight:400}
.qv{display:flex;align-items:center;gap:4px;margin:3px 0}
.qv input{flex:1;min-width:0;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--fg);font-size:22px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;padding:0}
.qv input::-webkit-inner-spin-button{display:none}
.stp{width:26px;height:26px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;font-size:16px;line-height:1;padding:0;flex:none}.stp:hover{border-color:var(--acc)}
.qc input[type=range]{width:100%;accent-color:var(--acc);margin:0;height:14px}
.qc.lock{opacity:.4}.why{display:none;font-size:11px;color:var(--amb);margin-top:2px}.qc.lock .why{display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px 18px}
#pg-al .fgrid,#pg-ds .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
.f label.chk{justify-content:flex-start;margin:0}.f label{display:flex;justify-content:space-between;font-size:12.5px;color:#c3d3c9;margin-bottom:4px;gap:8px}
.f input[type=number],.f select,.f input[type=text]{background:#08100c;border:1px solid var(--line);border-radius:4px;padding:6px 8px;width:100%}
.f input[type=range]{width:100%;accent-color:var(--acc)}
select{background:#08100c;border:1px solid var(--line);border-radius:4px;padding:5px 7px}
.hint{font-size:12px;color:var(--mut)}.note{font-size:12px;color:var(--amb)}
.prev{aspect-ratio:16/9;width:100%;border:0;background:#000;display:block}
.pvw{width:100%;background:#000}.cols2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.btn.bas{border-color:var(--acc);color:var(--acc)}.btn.bas:hover{background:#10281b}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:12.5px}.kv span{color:var(--mut)}.kv b{text-align:right;font-variant-numeric:tabular-nums}
.alist{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:700}.al{padding:5px 9px;border-radius:3px}.al.p3{background:#5a1218;color:#ffb3b8}.al.p2{background:#4a3a00;color:#ffe48a}.al.p1{background:#0d3a45;color:#9fe8ff}
.ro{background:#3a1a1d;border-bottom:1px solid #7a2a30;padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:#ffb3b8}
body.readonly .cwrap .panel:not(.keep) .pb,body.readonly .cwrap .tabs{pointer-events:none;opacity:.5}
/*THEME_CSS*/
/*REMOTE_CSS*/
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#d9ffe9;color:#06210f;padding:9px 16px;border-radius:5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s;z-index:30;max-width:90vw}.toast.on{opacity:1}
.phb{height:5px;background:#0a120e;border-radius:3px;overflow:hidden}.phb i{display:block;height:100%;background:var(--acc);width:0}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
@media(max-width:1250px){body.console{min-width:0}.cwrap{grid-template-columns:1fr;height:auto}.cwrap>*{overflow:visible}.cols2{grid-template-columns:1fr}}
</style>

<script>
(() => {
'use strict';
const { SIM0, FS, RING, clamp, KEYS, LIMITS, PULSELESS, clockT, TtoP, clockP, truth, Core, nibpResult, cuffPressure, NIBP_SECONDS, rhythmRules, couple, SCENARIOS, defaultSession, sanitize, DEFAULT_DISPLAY } = ENGINE;
const $ = (id, r) => (r || document).getElementById(id);
const qs = new URLSearchParams(location.search);
const smallTouch = !qs.get('mode') && !!window.matchMedia && matchMedia('(max-width: 700px) and (pointer: coarse)').matches;
const MODE = (qs.get('mode') === 'projection' || qs.get('mode') === 'monitor') ? 'display' : (qs.get('mode') === 'remote' || smallTouch) ? 'remote' : 'console';
const EMBED = qs.get('embed') === '1';
const BUILD = (document.querySelector('meta[name=build]') || {}).content || 'dev';
const LS = 'pulselab:session:v2', CHN = 'pulselab-v2', myId = Math.random().toString(36).slice(2, 8);
const bc = 'BroadcastChannel' in window ? new BroadcastChannel(CHN) : null;
const post = m => { m.id = myId; try { bc && bc.postMessage(m); } catch (e) {} };
function loadS() { try { const r = localStorage.getItem(LS); if (r) return sanitize(JSON.parse(r)); const v1 = localStorage.getItem('pulselab-state-v1'); if (v1) return sanitize(JSON.parse(v1)); } catch (e) {} return defaultSession(); }
function saveS(S) { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
const SC = Object.fromEntries(SCENARIOS.map(s => [s.id, s]));
const RH = { sinus: 'Sinusal', afib: 'Fibrilação atrial', flutter: 'Flutter atrial', svt: 'Taquicardia supraventricular', avb3: 'BAV total', tdp: 'Torsades de pointes', vt: 'TV monomórfica (com pulso)', vtp: 'TV sem pulso', vf: 'Fibrilação ventricular', asys: 'Assistolia', pea: 'AESP', leadoff: 'Eletrodo solto' };
const PAR = [['hr', 'Frequência cardíaca', 'bpm', 0, 300, 1, 'FC'], ['sys', 'PA sistólica', 'mmHg', 0, 300, 1, 'PAS'], ['dia', 'PA diastólica', 'mmHg', 0, 200, 1, 'PAD'], ['rr', 'Frequência respiratória', 'irpm', 0, 60, 1, 'FR'], ['spo2', 'SpO₂', '%', 0, 100, 1, 'SpO₂'], ['etco2', 'EtCO₂', 'mmHg', 0, 100, 1, 'EtCO₂'], ['temp', 'Temperatura', '°C', 26, 43, 0.1, 'TEMP']];
const DURS = [[0, 'imediato'], [10, '10 s'], [30, '30 s'], [60, '1 min'], [120, '2 min'], [300, '5 min'], [600, '10 min']];
const GROUPS = [['Normal', ['basal', 'taqui', 'brady']], ['Choque e deterioração', ['hemo', 'sepse', 'cardio', 'anafi', 'tamp', 'pneumo']], ['Respiratório e metabólico', ['hipox', 'dpoc', 'tep', 'edema', 'opioide', 'cad']], ['Arritmias e artefato', ['fa', 'fl', 'tsv', 'bav', 'esv', 'vt', 'lead']], ['Outras emergências', ['iam', 'hiper', 'hm', 'hipot', 'rosc']], ['Parada cardíaca', ['vtp', 'vf', 'tdp', 'asys', 'pea']]];
/*UI_JS*/
/*REMOTE_JS*/
const fmt = v => v === null || v === undefined ? '---' : v;
const temp1 = t => Number(t).toFixed(1).replace('.', ',');
function rhythmLabel(S, hr) {
  if (S.rhythm === 'sinus') { if (hr !== null && hr > 100) return 'TAQUICARDIA SINUSAL'; if (hr !== null && hr < 60) return 'BRADICARDIA SINUSAL'; return 'RITMO SINUSAL'; }
  return (RH[S.rhythm] || '').toUpperCase().replace(' (COM PULSO)', '');
}
function toast(s) { const t = $('toast'); t.textContent = s; t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), 2600); }

/* =================== EXIBIÇÃO =================== */
const MON = `<div class="stage" id="stage">
<div class="top"><div class="bed"><b id="bed"></b><span id="pname"></span></div><div class="banner" id="banner"><span id="bantxt">&nbsp;</span></div><div class="tr"><span id="chip" class="chip hide"></span><span id="mute" class="mute hide"></span><span id="clock"></span></div></div>
<div class="main"><div class="waves">
<div class="wave" id="w-ecg"><canvas class="g"></canvas><canvas class="t"></canvas><div class="wl" style="color:var(--ecg)"><b>ECG</b> II &nbsp;<span id="l-ecg"></span></div><div class="rt" id="rhy"></div></div>
<div class="wave" id="w-pleth"><canvas class="g"></canvas><canvas class="t"></canvas><div class="wl" style="color:var(--spo2)"><b>PLETH</b> SpO₂</div></div>
<div class="wave" id="w-resp"><canvas class="g"></canvas><canvas class="t"></canvas><div class="wl" style="color:var(--co2)"><b>RESP</b> impedância</div></div>

<div class="frozen hide" id="frozen">CONGELADO</div>
</div><div class="nums" id="nums">
<div class="box" id="b-hr"><div class="lab"><b>FC</b> bpm<i class="dot" id="dot"></i><span class="lim" id="lim-hr"></span></div><div class="val" id="v-hr">---</div></div>

<div class="box" id="b-nibp"><div class="lab"><b>PNI</b> mmHg<span class="lim" id="lim-nibp"></span></div><div class="val" id="v-nibp">---/---</div><div class="sub" id="s-nibp">&nbsp;</div></div>

<div class="box" id="b-temp"><div class="lab"><b>TEMP</b> °C</div><div class="val" id="v-temp">---</div></div>
</div></div>
<div class="foot"><span id="f-left"></span><span class="mid">Criado por Enf. Rubens Diniz</span><span><span class="sndst off" id="sndst"></span> &nbsp;build <span id="f-build"></span></span></div>
<button class="gate hide" id="gate" type="button"><b>TOQUE PARA INICIAR A PROJEÇÃO</b><span>Um clique libera o som dos alarmes e do bip de batimento. Depois disso o som funciona sozinho, sem pedir de novo.</span><i>INICIAR</i></button>
</div>`;

function startDisplay() {
  document.body.classList.add('display'); if (EMBED) document.body.classList.add('embed');

      const kp = $('kpis'); if (!kp.children.length) kp.innerHTML = tiles.map(t => `<div class="kpi" style="--kc:${t[4]}"><div class="kl">${ic(t[3])}${t[1]}<small style="margin-left:auto;font-weight:600;letter-spacing:0;color:#7b9186">${t[2]}</small></div><div class="kv2" id="kp-${t[0]}"></div><div class="ks" id="ks-${t[0]}"></div></div>`).join('');
      tiles.forEach(t => { const e = $('kp-' + t[0]), v = String(t[5].v); if (e.textContent !== v) { e.textContent = v; e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); } e.classList.toggle('tg', t[5].t); e.classList.toggle('sm', v.length > 6); $('ks-' + t[0]).textContent = t[6]; });
      $('kp-src').textContent = ms ? 'valores medidos pelo monitor' : 'projeção fechada: mostrando os alvos';
      $('chips').innerHTML = `<span class="chipx">${ic('heart')}${RH[S.rhythm]}</span><span class="chipx">${ic('scenario')}${(SC[S.scen.id] || { name: 'Personalizado' }).name}</span>${S.cpr ? `<span class="chipx red">${ic('bolt')}RCP em curso</span>` : ''}${S.clock.running ? '' : `<span class="chipx red">${ic('pause')}Congelado</span>`}${S.alarm.silencedUntil > now() ? `<span class="chipx red">${ic('bellOff')}Alarmes silenciados</span>` : ''}${S.audio.mute ? `<span class="chipx red">${ic('mute')}Som desligado</span>` : ''}`; }
    const al = [].concat(...[...displays.values()].filter(d => !d.embed).map(d => d.alarms)).concat(proj.length ? [] : ([...displays.values()][0] || { alarms: [] }).alarms);
    const seen = new Set(), list = al.filter(a => !seen.has(a.text) && seen.add(a.text)).sort((a, b) => b.prio - a.prio);
    const cur = new Set(list.map(a => a.text)); for (const t of cur) if (!seenAl.has(t)) logEv('Alarme: ' + t); seenAl.clear(); cur.forEach(t => seenAl.add(t));
    $('log').innerHTML = LOG.length ? LOG.slice(0, 14).map(l => `<div><b style="color:var(--fg);font-variant-numeric:tabular-nums">${l[0]}</b> &nbsp;${l[1]}</div>`).join('') : 'Nenhum evento ainda.';
    $('alarms').innerHTML = list.length ? '<div class="alist">' + list.map(a => `<div class="al p${a.prio}">${a.text}</div>`).join('') + '</div>' : '<div class="hint">Sem alarmes ativos.</div>';
    if (S.scen.id !== 'custom') renderPhase();
    const ss = $('snd-st'); if (ss) { ss.textContent = proj.length ? (proj.some(d => d.audio === 'ok') ? 'Projeção conectada: som liberado.' : 'Projeção conectada: aguardando o clique inicial na tela da projeção.') : 'Projeção fechada. Abra a projeção e clique nela uma vez para liberar o som.'; ss.style.color = proj.some(d => d.audio === 'ok') ? 'var(--acc)' : 'var(--amb)'; }
  }
  setInterval(status, 500); status();
  window.addEventListener('storage', e => { if (e.key === LS && e.newValue && readOnly) { try { S = sanitize(JSON.parse(e.newValue)); draft = mkDraft(); renderAll(); } catch (err) {} } });
  window.__pl = { get S() { return S; }, get RM() { return RM; }, ids: SCENARIOS.map(x => x.id), commit, applyScenario };
}

if (MODE === 'display') startDisplay(); else if (MODE === 'remote') startRemote(); else startConsole();
})();
